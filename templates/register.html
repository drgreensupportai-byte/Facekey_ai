{% extends "base.html" %}

{% block title %}Register Biometrics - FaceKey AI{% endblock %}

{% block content %}
<!-- Include MediaPipe scripts for Face Landmark Detection -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

<style>
    .biometric-wrapper {
        position: relative;
        width: 340px;
        height: 340px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .video-container {
        position: relative;
        width: 300px;
        height: 300px;
        border-radius: 50%;
        overflow: hidden;
        border: 4px solid var(--accent-color, #38bdf8);
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        z-index: 2;
        background-color: #0f172a;
    }

    #webcam, #mesh-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
    }

    .outer-loader-ring {
        position: absolute;
        top: 0;
        left: 0;
        width: 340px;
        height: 340px;
        border-radius: 50%;
        border: 4px solid rgba(56, 189, 248, 0.15);
        border-top: 4px solid #38bdf8;
        border-right: 4px solid #38bdf8;
        z-index: 1;
        display: none;
        animation: fastRotate 1.2s linear infinite;
    }

    @keyframes fastRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .progress-bar-container {
        width: 300px;
        height: 10px;
        background: #1e293b;
        border-radius: 5px;
        margin: 12px auto 0 auto;
        overflow: hidden;
        border: 1px solid #334155;
    }

    .progress-fill {
        height: 100%;
        width: 0%;
        background: #2ef8a0;
        transition: width 0.3s ease;
    }

    .status-box {
        margin-top: 1rem;
        font-weight: bold;
        transition: color 0.4s ease;
        min-height: 1.8rem;
    }

    .form-input-container {
        max-width: 340px;
        margin: 1.5rem auto 1rem auto;
    }

    .form-input-container input {
        width: 100%;
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid #334155;
        background: #0f172a;
        color: #f8fafc;
        outline: none;
        box-sizing: border-box;
        transition: border-color 0.2s ease;
    }

    .form-input-container input:focus {
        border-color: #38bdf8;
    }

    .action-btn {
        background: #38bdf8;
        color: #0f172a;
        font-weight: bold;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.1s ease;
    }

    .action-btn:hover:not(:disabled) {
        background: #0284c7;
        color: #ffffff;
    }

    .action-btn:disabled {
        background: #475569;
        color: #94a3b8;
        cursor: not-allowed;
    }
</style>

<div class="card text-center">
    <h2>👤 Multi-Angle Face Registration</h2>
    <p>Andika izina ryawe hanyuma ukurikize amabwiriza yo guhindukiza umutwe mu mpande zose.</p>

    <div class="form-input-container">
        <input type="text" id="username-input" placeholder="Izina ryawe (Username)..." required autocomplete="off" />
    </div>

    <div class="biometric-wrapper">
        <div id="outer-loader" class="outer-loader-ring"></div>

        <div class="video-container">
            <video id="webcam" autoplay playsinline muted></video>
            <canvas id="mesh-canvas"></canvas>
            <canvas id="capture-canvas" width="320" height="240" style="display:none;"></canvas>
        </div>
    </div>

    <div class="progress-bar-container">
        <div id="progress-fill" class="progress-fill"></div>
    </div>

    <div id="status-msg" class="status-box">
        Gukingura camera n'amajwi...
    </div>

    <div style="margin-top: 1.5rem;">
        <button id="register-btn" class="action-btn" onclick="captureAndRegister()" disabled>
            ⚡ Emeza Kwandikisha
        </button>
    </div>
</div>

<script>
    const AUDIO_RECORD_MS = 1200;

    const PENDING_POSES = [
        { name: "FRONT", msg: "👀 Reba neza imbere mu kamera..." },
        { name: "LEFT", msg: "👈 Hindukirira IBUMOSO gake..." },
        { name: "RIGHT", msg: "👉 Hindukirira IBURASIRAZUBA (Iburyo)..." },
        { name: "UP", msg: "👆 Zamura umutwe hejuru gake..." },
        { name: "DOWN", msg: "👇 Cobeka umutwe hasi gake..." }
    ];

    const video = document.getElementById('webcam');
    const meshCanvas = document.getElementById('mesh-canvas');
    const captureCanvas = document.getElementById('capture-canvas');
    const outerLoader = document.getElementById('outer-loader');
    const statusMsg = document.getElementById('status-msg');
    const registerBtn = document.getElementById('register-btn');
    const usernameInput = document.getElementById('username-input');
    const progressFill = document.getElementById('progress-fill');
    const meshCtx = meshCanvas.getContext('2d');

    let isProcessing = false;
    let mediaStream = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let cameraInstance = null;
    let faceDetected = false;

    let currentPoseIndex = 0;
    let capturedImages = [];

    function resizeCanvas() {
        if (meshCanvas.width !== video.videoWidth || meshCanvas.height !== video.videoHeight) {
            meshCanvas.width = video.videoWidth || 320;
            meshCanvas.height = video.videoHeight || 240;
        }
    }

    const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: false,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    faceMesh.onResults((results) => {
        resizeCanvas();
        meshCtx.clearRect(0, 0, meshCanvas.width, meshCanvas.height);

        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
            faceDetected = true;
            if (!isProcessing) registerBtn.disabled = false;

            const landmarks = results.multiFaceLandmarks[0];
            meshCtx.fillStyle = '#38bdf8';
            for (const landmark of landmarks) {
                const x = landmark.x * meshCanvas.width;
                const y = landmark.y * meshCanvas.height;

                meshCtx.beginPath();
                meshCtx.arc(x, y, 1.0, 0, 2 * Math.PI);
                meshCtx.fill();
            }
        } else {
            faceDetected = false;
            if (!isProcessing) registerBtn.disabled = true;
        }
    });

    // Boot Sensors Stream
    navigator.mediaDevices.getUserMedia({ 
        video: { width: { ideal: 320 }, height: { ideal: 240 }, frameRate: { ideal: 30 } }, 
        audio: true 
    })
    .then(stream => { 
        setupStream(stream, true);
    })
    .catch(err => {
        navigator.mediaDevices.getUserMedia({ 
            video: { width: { ideal: 320 }, height: { ideal: 240 } }, 
            audio: false 
        })
        .then(stream => {
            setupStream(stream, false);
        })
        .catch(vidErr => {
            statusMsg.innerText = "Ikosa ku gufata camera: " + vidErr.message;
            statusMsg.style.color = "#f87171";
        });
    });

    function setupStream(stream, hasAudio) {
        mediaStream = stream;
        video.srcObject = stream;

        statusMsg.innerText = hasAudio 
            ? "⚡ Reba mu kamera hanyuma ukande 'Emeza Kwandikisha'." 
            : "⚡ Reba mu kamera hanyuma ukande 'Emeza Kwandikisha' (Ikamera gusa).";
        statusMsg.style.color = "#38bdf8";

        cameraInstance = new Camera(video, {
            onFrame: async () => {
                if (video && video.readyState >= 2) {
                    await faceMesh.send({ image: video });
                }
            },
            width: 320,
            height: 240
        });
        cameraInstance.start();
    }

    function getSupportedMimeType() {
        const types = [
            'audio/webm;codecs=opus',
            'audio/webm',
            'audio/mp4',
            'audio/ogg',
            'audio/wav'
        ];
        for (let t of types) {
            if (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported(t)) {
                return t;
            }
        }
        return '';
    }

    function captureAndRegister() {
        const username = usernameInput.value.trim();
        if (!username) {
            statusMsg.innerText = "⚠️ Banza wandike izina ryawe (Username).";
            statusMsg.style.color = "#fbbf24";
            usernameInput.focus();
            return;
        }

        if (isProcessing || !faceDetected || video.readyState < 2) return;
        isProcessing = true;
        registerBtn.disabled = true;

        capturedImages = [];
        currentPoseIndex = 0;
        progressFill.style.width = "0%";

        outerLoader.style.display = 'block';

        // Start multi-angle capture sequence
        capturePoseLoop(username);
    }

    function capturePoseLoop(username) {
        if (currentPoseIndex >= PENDING_POSES.length) {
            statusMsg.innerText = "🎙️ Fata ijwi ryawe no koherereza amashusho...";
            statusMsg.style.color = "#38bdf8";
            recordAudioAndDispatch(username);
            return;
        }

        const pose = PENDING_POSES[currentPoseIndex];
        statusMsg.innerText = pose.msg;
        statusMsg.style.color = "#fbbf24";

        setTimeout(() => {
            if (faceDetected && video.readyState >= 2) {
                const captureCtx = captureCanvas.getContext('2d');
                captureCanvas.width = 320;
                captureCanvas.height = 240;
                captureCtx.drawImage(video, 0, 0, 320, 240);
                
                const imageData = captureCanvas.toDataURL('image/jpeg', 0.6);
                capturedImages.push(imageData);

                currentPoseIndex++;
                const percentage = (currentPoseIndex / PENDING_POSES.length) * 100;
                progressFill.style.width = percentage + "%";

                capturePoseLoop(username);
            } else {
                statusMsg.innerText = "⚠️ Suragukanya! " + pose.msg;
                setTimeout(() => capturePoseLoop(username), 800);
            }
        }, 1000);
    }

    function recordAudioAndDispatch(username) {
        audioChunks = [];
        try {
            const audioTracks = mediaStream ? mediaStream.getAudioTracks() : [];
            if (audioTracks.length > 0 && audioTracks[0].enabled) {
                const mimeType = getSupportedMimeType();
                const options = mimeType ? { mimeType } : {};
                mediaRecorder = new MediaRecorder(mediaStream, options);
            } else {
                mediaRecorder = null;
            }
        } catch (e) {
            console.warn("Audio recorder initialization fallback triggered:", e);
            mediaRecorder = null;
        }

        if (mediaRecorder) {
            mediaRecorder.ondataavailable = event => {
                if (event.data && event.data.size > 0) audioChunks.push(event.data);
            };

            mediaRecorder.onstop = () => {
                const mimeType = mediaRecorder.mimeType || 'audio/webm';
                const audioBlob = new Blob(audioChunks, { type: mimeType });
                const reader = new FileReader();

                reader.onloadend = () => {
                    dispatchRegisterPayload(username, capturedImages, reader.result);
                };

                reader.readAsDataURL(audioBlob);
            };

            try {
                mediaRecorder.start();
                setTimeout(() => {
                    if (mediaRecorder && mediaRecorder.state === "recording") {
                        mediaRecorder.stop();
                    }
                }, AUDIO_RECORD_MS);
            } catch (recStartErr) {
                console.warn("MediaRecorder start error:", recStartErr);
                dispatchRegisterPayload(username, capturedImages, null);
            }
        } else {
            dispatchRegisterPayload(username, capturedImages, null);
        }
    }

    function dispatchRegisterPayload(username, imagesArray, audioData) {
        const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';

        fetch('/api/register', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken
            },
            body: JSON.stringify({
                username: username,
                images: imagesArray,
                image_data: imagesArray[0], // Fallback for single-image route logic
                audio_data: audioData
            })
        })
        .then(async res => {
            if (!res.ok) {
                const errorText = await res.text();
                console.error("Server Error HTML Response:", errorText);
                throw new Error(`Server yagaragaje ikosa (${res.status}). Reba Terminal ya Python.`);
            }
            return res.json();
        })
        .then(data => {
            outerLoader.style.display = 'none';

            if (data.success) {
                if (cameraInstance && typeof cameraInstance.stop === 'function') {
                    cameraInstance.stop();
                }
                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                }

                statusMsg.innerText = `✓ ${data.message || 'Wiyandikishije neza!'}`;
                statusMsg.style.color = "#2ef8a0";

                setTimeout(() => { 
                    window.location.href = data.redirect || "/login"; 
                }, 1200);
            } else {
                statusMsg.innerText = "🔍 " + (data.message || "Kwandikisha ntibikunze. Ongera ugerageze.");
                statusMsg.style.color = "#fbbf24";
                
                isProcessing = false;
                registerBtn.disabled = !faceDetected;
            }
        })
        .catch(err => {
            outerLoader.style.display = 'none';
            statusMsg.innerText = "Server Error: " + err.message;
            statusMsg.style.color = "#f87171";

            isProcessing = false;
            registerBtn.disabled = !faceDetected;
        });
    }
</script>
{% endblock %}
